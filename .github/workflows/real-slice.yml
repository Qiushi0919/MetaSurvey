name: Historical real-slice entry (local evidence required)
on: [workflow_dispatch]
# Requires original local archives. Use review.yml for public synthetic checks.
permissions:
  contents: read
jobs:
  offline-gate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node real-slice/scripts/check.mjs
      # Network collectors and actual models are deliberately absent from CI.
