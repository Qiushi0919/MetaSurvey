name: Public synthetic engineering checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable-review:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: node scripts/verify-contracts.mjs
      - run: node tools/github_publication/test_node.mjs
      - run: python -B tools/github_publication/test_python.py
      # Synthetic engineering checks never grant source/PIT/trading admission.
