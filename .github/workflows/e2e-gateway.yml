name: E2E compatible gateway input V3 isolated synthetic checks
on:
  push:
    paths: ['experiments/e2e_gateway_v3/**', 'docs/e2e-gateway-v3/**', 'tools/e2e_gateway/**', 'workbench/**']
  pull_request:
    paths: ['experiments/e2e_gateway_v3/**', 'docs/e2e-gateway-v3/**', 'tools/e2e_gateway/**', 'workbench/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B tools/e2e_gateway/check.py ci-results/e2e-gateway
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-gateway-${{ matrix.os }}
          path: ci-results/e2e-gateway
      - if: always()
        run: cat ci-results/e2e-gateway/result.json >> "$GITHUB_STEP_SUMMARY"
