name: E2E pilot isolated synthetic checks
on:
  push:
    paths: ['experiments/e2e_pilot_v1/**', 'contracts/e2e-pilot-v1/**', 'tools/e2e_pilot/**', 'workbench/**']
  pull_request:
    paths: ['experiments/e2e_pilot_v1/**', 'contracts/e2e-pilot-v1/**', 'tools/e2e_pilot/**', 'workbench/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B tools/e2e_pilot/check.py ci-results/e2e-pilot
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pilot-${{ matrix.os }}
          path: ci-results/e2e-pilot
      - if: always()
        run: cat ci-results/e2e-pilot/result.json >> "$GITHUB_STEP_SUMMARY"
